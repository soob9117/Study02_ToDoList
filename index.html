<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app"></main>

  <script src="js/dates.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/todos.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      "use strict";
      // 저장소 접근 자체가 막힌 환경에서도 앱은 동작해야 한다(Storage 함수가 예외를 처리함).
      let storage = null;
      try {
        storage = window.localStorage;
      } catch (e) {
        storage = null;
      }
      TodoApp.App.init({ root: document.getElementById("app"), storage });
    })();
  </script>
</body>
</html>
